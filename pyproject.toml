[build-system]
requires = ['setuptools>=61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'xtreys'
version = '0.2.4'
license = { text = "MIT" }
authors = [
  { name = 'TheCursedOne' },
]
description = 'An extended add-on that is mixable with Treys.'
readme = 'README.md'
requires-python = '>=3.7'
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
]
dependencies = [
    'treys'
]

[project.urls]
Homepage = 'https://github.com/bingchiliingsacker-dot/Xtreys'
